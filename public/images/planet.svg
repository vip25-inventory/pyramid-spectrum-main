<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Map and navigation illustration -->
  <defs>
    <!-- Paper texture -->
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ee"/>
      <stop offset="100%" stop-color="#f5e9d7"/>
    </linearGradient>
    
    <!-- Compass gradient -->
    <linearGradient id="compassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f8f8"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="3"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Map background -->
  <rect x="50" y="70" width="200" height="160" fill="url(#paperGradient)" stroke="#e0d5c0" stroke-width="1" filter="url(#dropShadow)" transform="rotate(-5, 150, 150)"/>
  
  <!-- Map fold lines -->
  <line x1="50" y1="150" x2="250" y2="150" stroke="#e0d5c0" stroke-width="1" stroke-dasharray="2,2" transform="rotate(-5, 150, 150)"/>
  <line x1="150" y1="70" x2="150" y2="230" stroke="#e0d5c0" stroke-width="1" stroke-dasharray="2,2" transform="rotate(-5, 150, 150)"/>
  
  <!-- Map details - roads -->
  <path d="M70 130 Q120 110, 150 140 Q180 170, 230 150" fill="none" stroke="#bfbfbf" stroke-width="3" stroke-linecap="round" transform="rotate(-5, 150, 150)"/>
  <path d="M100 100 L170 180" fill="none" stroke="#bfbfbf" stroke-width="3" stroke-linecap="round" transform="rotate(-5, 150, 150)"/>
  <path d="M190 100 L130 200" fill="none" stroke="#bfbfbf" stroke-width="3" stroke-linecap="round" transform="rotate(-5, 150, 150)"/>
  
  <!-- Map details - land features -->
  <path d="M80 90 Q100 80, 120 90 Q140 100, 130 120 Q120 130, 100 125 Q80 120, 80 90 Z" fill="#a8d5a8" stroke="#98c598" stroke-width="1" transform="rotate(-5, 150, 150)"/>
  <path d="M190 170 Q210 160, 230 170 Q240 180, 230 200 Q220 210, 200 205 Q180 200, 190 170 Z" fill="#a8d5a8" stroke="#98c598" stroke-width="1" transform="rotate(-5, 150, 150)"/>
  
  <!-- Map details - water -->
  <path d="M160 80 Q190 70, 220 80 Q230 100, 220 115 Q190 125, 170 110 Q160 95, 160 80 Z" fill="#b3d8f2" stroke="#9ac3e6" stroke-width="1" transform="rotate(-5, 150, 150)"/>
  
  <!-- Map details - route marker -->
  <path d="M90 180 L110 120 L180 100 L210 190" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3" transform="rotate(-5, 150, 150)"/>
  
  <!-- Location pins -->
  <g transform="translate(90, 180) rotate(-5)">
    <path d="M0 0 L0 -15 C0 -25, 15 -25, 15 -15 L15 0 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
    <circle cx="7.5" cy="-20" r="5" fill="#c0392b"/>
  </g>
  
  <g transform="translate(210, 190) rotate(-5)">
    <path d="M0 0 L0 -15 C0 -25, 15 -25, 15 -15 L15 0 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
    <circle cx="7.5" cy="-20" r="5" fill="#c0392b"/>
  </g>
  
  <!-- Compass -->
  <g transform="translate(70, 90) scale(0.8)">
    <circle cx="0" cy="0" r="30" fill="url(#compassBg)" stroke="#ccc" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#aaa" stroke-width="1"/>
    
    <!-- Compass rose -->
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#333" stroke-width="2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#333" stroke-width="2"/>
    
    <polygon points="0,-25 5,-15 -5,-15" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
    <polygon points="0,25 5,15 -5,15" fill="#333" stroke="#333" stroke-width="1"/>
    <polygon points="-25,0 -15,5 -15,-5" fill="#333" stroke="#333" stroke-width="1"/>
    <polygon points="25,0 15,5 15,-5" fill="#333" stroke="#333" stroke-width="1"/>
    
    <text x="0" y="-10" font-size="10" text-anchor="middle" fill="#333" font-family="Arial">N</text>
    <text x="0" y="15" font-size="10" text-anchor="middle" fill="#333" font-family="Arial">S</text>
    <text x="-12" y="3" font-size="10" text-anchor="middle" fill="#333" font-family="Arial">W</text>
    <text x="12" y="3" font-size="10" text-anchor="middle" fill="#333" font-family="Arial">E</text>
  </g>
  
  <!-- Magnifying glass -->
  <g transform="translate(220, 100) rotate(10)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#333" stroke-width="3"/>
    <line x1="20" y1="20" x2="35" y2="35" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="20" fill="#e8f4fc" opacity="0.3"/>
  </g>
  
  <!-- "X marks the spot" -->
  <g transform="translate(180, 100) rotate(-5)">
    <path d="M-10 -10 L10 10 M-10 10 L10 -10" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg> 